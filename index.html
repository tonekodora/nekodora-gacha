<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猫ドラ UR確定5連シミュレーター</title>
<style>
  body {
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
    background-color: #12161f;
    color: #ffffff;
    margin: 0;
    padding: 15px;
    text-align: center;
  }
  .container {
    max-width: 500px;
    margin: 0 auto;
    background: #1e2433;
    border: 2px solid #3a445e;
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.6);
  }
  h1 {
    font-size: 18px;
    margin: 0 0 15px 0;
    padding: 8px;
    background: linear-gradient(90deg, #1c5fab, #10437d, #1c5fab);
    border-radius: 6px;
    border: 1px solid #5a85b5;
  }
  .btn-group {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 15px;
  }
  button {
    font-size: 16px;
    font-weight: bold;
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.05s, opacity 0.2s;
  }
  button:active {
    transform: scale(0.96);
  }
  .btn-pull {
    background: linear-gradient(180deg, #ff5e7e, #d61c4e);
    color: white;
    flex: 2;
    box-shadow: 0 3px 0 #8f0c2e;
  }
  .btn-pull10 {
    background: linear-gradient(180deg, #f7b731, #e58e26);
    color: #fff;
    flex: 1;
    box-shadow: 0 3px 0 #9e5b0b;
  }
  .btn-reset {
    background: #4b5563;
    color: #e5e7eb;
    padding: 8px 14px;
    font-size: 13px;
  }
  .results {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 20px;
    min-height: 230px;
  }
  .card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: bold;
    background: #2a3246;
    border-left: 6px solid #6b7280;
    text-align: left;
  }
  .badge {
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 4px;
    margin-right: 6px;
    display: inline-block;
  }
  .type-orb { background: #6d28d9; color: #fff; }
  .type-dragon { background: #047857; color: #fff; }

  /* コスト別装飾 */
  .cost-17 { border-left-color: #60a5fa; }
  .cost-18 { border-left-color: #34d399; }
  .cost-19 { border-left-color: #f87171; background: #3b232e; color: #fca5a5; }
  .cost-20 {
    border-left-color: #fbbf24;
    background: linear-gradient(90deg, #423316, #2a241b);
    color: #fde68a;
    border: 1px solid #d97706;
    border-left-width: 6px;
  }
  .cost-21 {
    background: linear-gradient(90deg, #3b1c42, #1e293b, #3b1c42);
    color: #ffffff;
    border: 2px solid #f472b6;
    box-shadow: 0 0 10px rgba(244, 114, 182, 0.6);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 6px rgba(244, 114, 182, 0.5); }
    50% { box-shadow: 0 0 14px rgba(96, 165, 250, 0.9); }
    100% { box-shadow: 0 0 6px rgba(244, 114, 182, 0.5); }
  }

  .stats-box {
    background: #151924;
    border: 1px solid #2e364a;
    border-radius: 8px;
    padding: 12px;
    font-size: 13px;
    text-align: left;
  }
  .stats-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #2e364a;
    padding-bottom: 6px;
    margin-bottom: 8px;
    font-weight: bold;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 10px;
  }
  th, td {
    padding: 4px 6px;
    text-align: right;
    border-bottom: 1px solid #222938;
  }
  th:first-child, td:first-child { text-align: left; }
  .history-box {
    max-height: 100px;
    overflow-y: auto;
    background: #0f121a;
    padding: 8px;
    border-radius: 4px;
    font-size: 12px;
    color: #fde68a;
  }
</style>
</head>
<body>

  <div class="btn-group">
    <button class="btn-pull" onclick="pullGacha(5)">5連を引く</button>

    <table>

        <tr><td>コスト20</td><td id="cnt-20">0</td><td id="rate-20">0.0%</td><td>4.07%</td></tr>
        <tr><td>コスト19</td><td id="cnt-19">0</td><td id="rate-19">0.0%</td><td>9.99%</td></tr>
        <tr><td>コスト18</td><td id="cnt-18">0</td><td id="rate-18">0.0%</td><td>34.85%</td></tr>
        <tr><td>コスト17</td><td id="cnt-17">0</td><td id="rate-17">0.0%</td><td>50.18%</td></tr>
      </tbody>
    </table>
    <div style="margin-bottom: 4px; font-weight: bold; color: #cbd5e1;">★高コスト(20以上)獲得履歴:</div>
    <div id="high-history" class="history-box">なし</div>
  </div>
</div>

  { cost: 21, type: "オーブ", weight: 0.0536, names: ["[もふもふ騎士]クー","[国産みの神]イザナギ","[竜狩の魔道士]ブルーノ","[金印の幸巫女]卑弥呼","[千福万来]シアナ","[気新光照]アマテラス","[傲慢な愛猫家]メドラウト","[慶雲昌光]スサノオ","[猫飼いの竜姫]モルガナ","[初凪の月姫]ツクヨミ","[魔装騎士]ヘキサ","[ほころぶ蕾]コノハナサクヤ","[夢世界の案内人]シャパリュ"] },

  { cost: 18, type: "ドラゴン", weight: 0.000909 * 100 / 1.3, names: ["フェニックス","ガルーダ","アトラス","ムシュフシュ","ハヌマーン","パブロペトリ","シリウス","ジャガーノート","オメテオトル","バロン","ブリーラー・レッスル","ア・プチ","ガラガラドン","ガンダルヴァ","メガラニカ","ミアプラキドゥス","タツノミヤ","ビフレスト","カスティーヨ","ラプシヌプルクル","アンゲロス","カワチ","カルーゼル","クノッソス","ミーティア","ニシキ","オオモノヌシ","アークトゥルス","ステラ","ドクガン"] },
  { cost: 19, type: "ドラゴン", weight: 0.000267 * 100 / 1.3, names: ["バハムート","テュポーン","ウロボロス","トナティウ","ペイルライダー","アポカリプス","フローズヴィトニル","ハクタク","ティタノマキア","黄龍","月輪龍","グラム","シバルバー","ネクロタフィオ","ストリゴイ","ピンギキュラ","コンセイ","シェーシャ","グリンカムビ","アペプ","ヴァララウコ","オロシリアン","カフィカ","バダイ","ルアウモコ","ローザンヌ","カプ","イエティ","ジェンネト","コウゲ","ボーデイ","シェアト","キュウビ・ノワール","ネクロノミコン"] },
  { cost: 20, type: "ドラゴン", weight: 0.000239 * 100 / 1.3, names: ["アプス","ティアマト","ヴァルハラ","タルタロス","ウシュムガル","ミノタウロス","ユグドラシル","ギンヌンガガプ","レーヴァテイン","グレイプニル","ヘイズルーン","ラモール","ダルメ","ホーヴヴァルプニル","アビドス","アンビュロケタス","スリュムヘイム","ヌクレオ","ヤパン"] }
];

// 抽選プールの構築
const pool = [];
let totalWeight = 0;

rawData.forEach(group => {
  group.names.forEach(name => {
    totalWeight += group.weight;
    pool.push({
      name: name,
      cost: group.cost,
      type: group.type,
      weight: group.weight,
      cumulative: totalWeight
    });
  });
});

// 統計データ
let totalPulls = 0;
let counts = { 17: 0, 18: 0, 19: 0, 20: 0, 21: 0 };
let highHistory = [];

function drawOne() {
  const r = Math.random() * totalWeight;
  for (let i = 0; i < pool.length; i++) {
    if (r <= pool[i].cumulative) {
      return pool[i];
    }
  }
  return pool[pool.length - 1];
}

function pullGacha(num) {
  const resultsDiv = document.getElementById("results");
  resultsDiv.innerHTML = "";

  for (let i = 0; i < num; i++) {
    const unit = drawOne();
    totalPulls++;
    counts[unit.cost]++;

    if (unit.cost >= 20) {
      highHistory.unshift(`[${totalPulls}連目] コスト${unit.cost} (${unit.type}) ${unit.name}`);
    }

    const card = document.createElement("div");
    card.className = `card cost-${unit.cost}`;
    const badgeClass = unit.type === "オーブ" ? "type-orb" : "type-dragon";
    
    card.innerHTML = `
      <div>
        <span class="badge ${badgeClass}">${unit.type}</span>
        <span>コスト${unit.cost} ${unit.name}</span>
      </div>
    `;
    resultsDiv.appendChild(card);
  }

  updateStats();
}

function updateStats() {
  document.getElementById("total-pulls").innerText = totalPulls;
  [17, 18, 19, 20, 21].forEach(c => {
    document.getElementById(`cnt-${c}`).innerText = counts[c];
    const rate = totalPulls > 0 ? ((counts[c] / totalPulls) * 100).toFixed(2) : "0.0";
    document.getElementById(`rate-${c}`).innerText = rate + "%";
  });

  const histDiv = document.getElementById("high-history");
  if (highHistory.length > 0) {
    histDiv.innerHTML = highHistory.join("<br>");
  } else {
    histDiv.innerText = "なし";
  }
}

function resetStats() {
  totalPulls = 0;
  counts = { 17: 0, 18: 0, 19: 0, 20: 0, 21: 0 };
  highHistory = [];
  document.getElementById("results").innerHTML = '<div style="color: #9ca3af; margin-top: 80px;">リセットしました。ボタンを押してガチャを引いてください</div>';
  updateStats();
}
</script>
</body>
</html>
